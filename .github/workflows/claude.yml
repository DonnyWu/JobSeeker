name: Claude Code

# Interactive mode: mention @claude in any issue or PR comment and Claude
# replies in the thread. It can also read CI results and push commits.
# Deliberately has no `prompt` input -- that is what keeps it interactive.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    # Avoids spinning up a runner for comments that don't mention @claude.
    if: contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

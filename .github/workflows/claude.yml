name: Claude Code

# Interactive mode: mention @claude in any issue or PR comment and Claude
# replies in the thread. It can also read CI results and push commits.
# Deliberately has no `prompt` input -- that is what keeps it interactive.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    # Avoids spinning up a runner for comments that don't mention @claude.
    if: contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # Pinned for the same reason as claude-review.yml: floating `@v1` moved onto
      # v1.0.202, whose Claude Code 2.1.243 install never creates ~/.local/bin.
      # Keep the two workflows on the same version so they fail and recover together.
      - uses: anthropics/claude-code-action@v1.0.201
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

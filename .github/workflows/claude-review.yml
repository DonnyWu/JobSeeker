name: Claude Review

# Reviews a PR when it opens, on every push to the PR branch, when a draft is
# marked ready, or when the `claude-review` label is added.
#
# `synchronize` is what makes it fire on every push. Drop it from the list to
# review only once when the PR is ready, and use the label for re-runs.
#
# Note: this needs an OPEN PR. Pushing a branch with no PR does nothing.
#
# The job, its permissions, and the review prompt live in the shared workflow
# at DonnyWu/claude-review, pinned to the v1 tag -- change the prompt there
# once instead of in every repository.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, labeled]

# Push three times in a row and only the last review runs -- the earlier ones
# are cancelled instead of each burning a full review's usage.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Skip drafts. `labeled` fires on ANY label, so let only `claude-review`
    # through -- otherwise adding `bug` would kick off a review.
    if: >
      github.event.pull_request.draft == false &&
      (github.event.action != 'labeled' || github.event.label.name == 'claude-review')
    uses: DonnyWu/claude-review/.github/workflows/review.yml@v1
    secrets: inherit
